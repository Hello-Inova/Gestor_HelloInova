<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Importar sistemas · Hello Inova</title>
  <link rel="icon" type="image/png" href="/assets/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-0: #05060a;
      --bg-1: #0a0c14;
      --panel: #10121e;
      --blue-700: #123fd6;
      --blue-500: #2f7bff;
      --blue-400: #57a2ff;
      --text-0: #f5f8ff;
      --text-2: #8993ad;
      --danger: #ff5470;
      --success: #2fe0a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #0d1330, var(--bg-0) 60%);
      font-family: 'Inter', sans-serif;
      color: var(--text-0);
      padding: 40px 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, var(--panel), var(--bg-1));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .card img { display: block; height: 40px; margin: 0 auto 20px; }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      text-align: center;
      margin: 0 0 6px;
    }
    p.sub { color: var(--text-2); font-size: 13px; text-align: center; margin: 0 0 20px; line-height: 1.5; }
    input[type="file"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-0);
      font-size: 13px;
      font-family: inherit;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--blue-700), var(--blue-400));
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .list { margin-top: 20px; font-size: 13px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .row .name { color: var(--text-0); }
    .row .status { color: var(--text-2); white-space: nowrap; }
    .row .status.ok { color: var(--success); }
    .row .status.fail { color: var(--danger); }
    .msg { margin-top: 16px; font-size: 13px; text-align: center; }
    .msg.error { color: var(--danger); }
    .msg.success { color: var(--success); }
    .warn-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 84, 112, 0.08);
      border: 1px solid rgba(255, 84, 112, 0.25);
      font-size: 12.5px;
      color: var(--text-1, #c7d0e6);
      line-height: 1.5;
      display: none;
    }
    a.back { display: block; text-align: center; margin-top: 18px; color: var(--blue-400); font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/logo-mark.png" alt="Hello Inova" />
    <h1>Importar sistemas de um arquivo local</h1>
    <p class="sub">
      Ferramenta única de migração — importa uma lista de sistemas a partir
      de um arquivo <code>.json</code> exportado do banco local, criando um
      registro por sistema na conta atual. <strong>Você precisa estar
      logado</strong> nesta mesma aba antes de usar esta página.
    </p>

    <input type="file" id="file-input" accept="application/json" />
    <button id="btn-import" disabled>Selecione um arquivo primeiro</button>

    <div id="list" class="list"></div>
    <div id="msg" class="msg"></div>
    <div id="warn-box" class="warn-box"></div>

    <a class="back" href="/">← Voltar para o sistema</a>
  </div>

  <script>
    var items = null;

    var fileInput = document.getElementById('file-input');
    var btn = document.getElementById('btn-import');
    var listEl = document.getElementById('list');
    var msgEl = document.getElementById('msg');
    var warnBox = document.getElementById('warn-box');

    fileInput.addEventListener('change', function () {
      var file = fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          items = JSON.parse(reader.result);
          if (!Array.isArray(items)) throw new Error('Formato inesperado.');
          btn.disabled = false;
          btn.textContent = 'Importar ' + items.length + ' sistema(s)';
          msgEl.textContent = '';
          msgEl.className = 'msg';

          var unrecoverable = items.filter(function (s) { return s.had_password_but_unrecoverable; });
          if (unrecoverable.length) {
            warnBox.style.display = 'block';
            warnBox.textContent =
              'Atenção: ' + unrecoverable.length + ' sistema(s) tinham uma senha salva que não pôde ser recuperada ' +
              '(chave de criptografia local diferente da que gerou aquela senha) — vão ser importados sem senha: ' +
              unrecoverable.map(function (s) { return s.name; }).join(', ') +
              '. Edite esses sistemas depois para digitar a senha novamente.';
          } else {
            warnBox.style.display = 'none';
          }
        } catch (err) {
          msgEl.textContent = 'Arquivo inválido: ' + err.message;
          msgEl.className = 'msg error';
          btn.disabled = true;
        }
      };
      reader.readAsText(file);
    });

    btn.addEventListener('click', async function () {
      if (!items || !items.length) return;
      btn.disabled = true;
      listEl.innerHTML = '';
      msgEl.textContent = '';
      msgEl.className = 'msg';

      var rows = items.map(function (item) {
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<span class="name">' + item.name + '</span><span class="status">aguardando…</span>';
        listEl.appendChild(row);
        return row.querySelector('.status');
      });

      var ok = 0, fail = 0;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var statusEl = rows[i];
        statusEl.textContent = 'enviando…';
        try {
          var body = {
            name: item.name,
            url: item.url,
            repo_url: item.repo_url || '',
            login_email: item.login_email || '',
            login_password: item.login_password || '',
            logo: item.logo || '',
            categories: item.categories || [],
            subscriptions: item.subscriptions || [],
            contact_name: item.contact_name || '',
            contact_whatsapp: item.contact_whatsapp || '',
            contact_email: item.contact_email || '',
            contract_file: item.contract_file || '',
            contract_file_name: item.contract_file_name || '',
          };
          var res = await fetch('/api/systems', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
          statusEl.textContent = 'importado ✓';
          statusEl.className = 'status ok';
          ok++;
        } catch (err) {
          statusEl.textContent = 'falhou: ' + err.message;
          statusEl.className = 'status fail';
          fail++;
        }
      }

      if (fail === 0) {
        msgEl.textContent = ok + ' sistema(s) importado(s) com sucesso!';
        msgEl.className = 'msg success';
      } else {
        msgEl.textContent = ok + ' importado(s), ' + fail + ' falharam. Veja os detalhes acima.';
        msgEl.className = 'msg error';
      }
      btn.textContent = 'Concluído';
    });
  </script>
</body>
</html>
